<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>云端巡航 · 飞机大战</title><link rel="stylesheet" href="/airwar.css"></head><body><main><header><div><small>A LITTLE ARCADE / 03</small><h1>云端巡航 <span>飞机大战</span></h1></div><button id="sound" aria-pressed="false">声音：关</button></header><div class="hud"><span id="armor">护甲 ♥♥♥♥♥</span><span id="power">火力 Ⅰ</span><span id="score">000000</span></div><div class="stage"><span id="stage-name">晨光海岸</span><span id="phase">准备出发</span></div><section class="screen" aria-label="飞机大战游戏"><canvas id="game" width="360" height="540" tabindex="0" aria-label="方向键或 WASD 移动，自动射击，空格释放炸弹，P 暂停"></canvas><div id="overlay"><small id="eyebrow">CLOUD PATROL</small><h2 id="title">向云海，出发。</h2><p id="description">移动躲避弹幕，飞机自动开火。<br>方向键 / WASD 移动，也可按住画面拖动。<br>空格释放炸弹，清除敌弹。</p><button id="start" disabled>正在装载素材…</button><span id="load-status" role="status">准备航线</span></div></section><div class="actions"><button id="bomb" disabled>◎ 炸弹 <b>2</b><small>空格 · 清除敌弹</small></button><p id="notice" role="status">手机在画面内拖动飞机；亮点是受伤判定中心。</p><button id="pause">暂停 Ⅱ</button></div><label class="scene-control">场景 <select id="scene" aria-label="选择游戏场景"><option value="auto">新景随关卡</option><option value="glacier">冰川群岛</option><option value="volcano">熔岩裂谷</option><option value="jungle">雨林遗迹</option><option value="coast">晨光海岸</option><option value="canyon">峡谷要塞</option><option value="night">星夜航道</option></select></label><nav id="levels" aria-label="选择已解锁关卡"></nav><footer>护甲耗尽可重试 · Boss 战设检查点 · 每 12 秒有补给</footer></main><script src="/airwar-core.js"></script><script src="/airwar-art.js"></script><script src="/airwar.js"></script></body></html>
