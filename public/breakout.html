<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>蔬果打砖块 · Loud Speak</title><link rel="stylesheet" href="/breakout.css"></head><body><main><header><div><small>THE LITTLE GARDEN ARCADE</small><h1>蔬果打砖块 <span>接住一点小快乐</span></h1></div><button id="sound" aria-pressed="false">声音：关</button></header><section class="hud" aria-label="游戏状态"><span>关卡 <b id="level">1 / 6</b></span><span>得分 <b id="score">0</b></span><span>生命 <b id="lives">3</b></span><span>最高 <b id="best">0</b></span></section><div class="screen"><canvas id="game" width="480" height="560" tabindex="0" aria-label="蔬果打砖块，鼠标、触屏或左右方向键移动，空格发球，P 暂停"></canvas><div id="overlay"><div><small>一小片花园，一场好心情</small><h2 id="title">让快乐，弹起来。</h2><p id="description"></p><button id="start">开始游戏 →</button></div></div></div><div id="powers" role="status">接住道具：加长 · 减速 · 多球</div><footer><p>鼠标 / 拖动 / ← → 或 A D 移动<br>点击 / 空格发球 · P 暂停</p><button id="pause">暂停 Ⅱ</button></footer></main><script src="/breakout-core.js"></script><script src="/breakout-art.js"></script><script src="/breakout.js"></script></body></html>
