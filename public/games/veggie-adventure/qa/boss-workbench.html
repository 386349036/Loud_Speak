<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss战只读验收工作台</title>
<style>body{margin:0;background:#14251f;color:#eaffdb;font:14px system-ui}header,section{padding:8px 12px}header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:6px;background:#34543a;color:#fff;border:1px solid #b2cb91;border-radius:4px}label{white-space:nowrap}canvas{display:block;width:auto;max-width:100%;max-height:70vh;height:auto;margin:auto;image-rendering:pixelated;background:#14251f}pre{white-space:pre-wrap;margin:4px 0}#scene{max-height:70vh;overflow:hidden}#log{max-height:100px;overflow:auto;font-size:12px}small{opacity:.8}</style>
<header><strong>Boss战只读验收工作台</strong><select id="boss" aria-label="Boss关卡"></select><select id="form" aria-label="主角形态"><option value="0">初始</option><option value="1">成长</option><option value="2">辣椒</option></select><button id="reset">重置本场</button><button id="play">实时运行</button></header>
<section><small>独立调试起点：直接在Boss场内开始，血量、伤害、碰撞和弱点均使用正式引擎。无无敌、不改存档；逐帧推进不是完整路线通关。</small><div><label>方向 <select id="direction" aria-label="移动方向"><option value="0">原地</option><option value="1">向右</option><option value="-1">向左</option></select></label> <label><input type="checkbox" id="jump">落地后合法连跳</label> <label><input type="checkbox" id="fire">持续攻击</label> <button id="step">推进0.5秒</button> <button id="step-short">推进0.1秒</button> <button id="step-long">推进5秒</button></div><pre id="state">准备素材…</pre></section>
<div id="scene"><canvas id="game" width="1290" height="720" aria-label="Boss验收画面"></canvas></div><section><pre id="log"></pre></section><script type="module" src="boss-workbench.mjs"></script></html>
