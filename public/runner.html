<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>蔬果出走 · Loud Speak</title><link rel="stylesheet" href="/runner.css"></head><body><main><header><div><small>THE LITTLE GARDEN RUN</small><h1>蔬果出走<span>像素里的小小远行</span></h1></div><button id="sound" aria-pressed="false">声音：关</button></header><div class="status"><span id="hero"></span><span id="stats"></span></div><div class="screen"><canvas id="game" width="384" height="216" aria-label="蔬果横版跑酷游戏"></canvas><div id="overlay"><small id="eyebrow">从菜园，跑向更远的地方</small><h2 id="title">今天也要向前跑。</h2><p id="description"></p><button id="start">出发 →</button></div></div><div class="progress"><i id="progress"></i></div><nav id="levels" aria-label="选择关卡"></nav><div class="controls"><button id="slide">↓ 下滑</button><span>短按低跳 · 长按高跳 · 再按二段跳<br>空格 / ↑ 跳跃　↓ 下滑</span><button id="jump">↑ 跳跃</button></div><footer><span id="hint">空中再按一次跳跃，可二段跳；落地恢复。</span><button id="pause">暂停 Ⅱ</button></footer></main><script src="/runner-core.js"></script><script src="/runner-scenery.js"></script><script src="/runner-art.js"></script><script src="/runner.js"></script></body></html>
