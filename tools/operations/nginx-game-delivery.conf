# Included inside the HTTPS server. Dynamic chat/API traffic stays proxied/private.
location ^~ /games/veggie-adventure/ {
 root /opt/loud/current/public;
 index index.html;
 try_files $uri $uri/ =404;
 etag on;
 if_modified_since exact;
 add_header Cache-Control "public, max-age=0, must-revalidate" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 gzip on;
 gzip_vary on;
 gzip_comp_level 5;
 gzip_min_length 256;
 gzip_types text/css text/javascript application/javascript application/json text/plain image/svg+xml;
 location ~ /\. { deny all; }
 location ~ \.mjs$ { default_type text/javascript; }
 location ~ \.png$ {
  try_files $uri$loud_webp_suffix $uri =404;
  add_header Cache-Control $loud_game_asset_cache;
  add_header Vary Accept always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
 }
}
