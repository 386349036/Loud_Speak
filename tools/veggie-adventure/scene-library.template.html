<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蔬果大冒险 · 全关卡场景库</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101b19;color:#e9eedb;font:16px/1.65 system-ui}header,main{max-width:1240px;margin:auto;padding:24px}header{padding-bottom:8px}h1{font-size:30px;margin:0}p{margin:10px 0}.muted{color:#aabcb0}.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px 0}select,button{font:inherit;padding:8px;border:1px solid #516358;border-radius:6px;background:#23372e;color:#eef5df}a{color:#c6e69d}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#19221e;border:1px solid #526554;border-radius:8px}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;image-rendering:pixelated}.middle{top:auto;height:80%;opacity:.65}.notice{border-left:3px solid #dbbd7c;padding-left:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}.card{background:#1b3028;border-radius:8px;overflow:hidden}.card h3,.card p{padding:0 16px}.source{display:block;width:100%;background:repeating-conic-gradient(#a7b4ad 0% 25%,#dbe3dc 0% 50%) 0/24px 24px}.source.dark{background:#17221e}.source.light{background:#eef1e9}input[type=range]{max-width:45vw}#loadStatus{font-size:14px}footer{padding:24px;color:#b8c5b9}button[aria-pressed=true]{outline:2px solid #d4e39a}details{margin:20px 0}summary{cursor:pointer}
</style>
<header><p class="muted">32-bit二维像素 · 场景源资产</p><h1>八个世界，三十二段旅程</h1><p>40张分层背景与组件源图 · 8张独立首领场景 · 按关卡查看素材组合</p><p class="notice">当前为美术源资产库。地形与机关表尚待切分、统一网格和补齐动画；预览不模拟碰撞，也不表示32关已经搭建完成。</p></header>
<main><div class="controls"><label>世界 <select id="world"></select></label><label>关卡 <select id="level"></select></label><label><input type="checkbox" id="showMid" checked>显示中景</label><label>中景强度 <input id="opacity" type="range" min="0" max="100" value="65"></label></div><h2 id="heading"></h2><p id="focus"></p><div class="stage"><img class="layer" id="back" alt="关卡远景或首领背景"><img class="layer middle" id="middle" alt="透明中景"></div><p id="loadStatus" role="status"></p><p class="muted">背景未验证循环接缝；首领背景自带构图，不叠加普通关中景。相同世界的普通关共享背景，路线差异通过关卡布局实现。</p><div class="controls"><span>透明图查看底色</span><button data-bg="check" aria-pressed="true">棋盘</button><button data-bg="dark" aria-pressed="false">深色</button><button data-bg="light" aria-pressed="false">浅色</button></div><div id="cards" class="cards"></div><details><summary>当前世界全部源文件与提示词</summary><div id="links"></div></details><p><a href="../../docs/veggie-adventure/scenes/LEVEL_ASSET_MAP.md">32关资产对应表</a> · <a href="../../docs/veggie-adventure/scenes/SCENE_ASSET_QA.md">检查记录与待处理项</a> · <a href="scene-workbench.html">第一关布局工作台</a> · <a href="index.html">角色与概念总览</a></p></main><footer>背景中的桥、灯光、水面与建筑仅作景物。可碰撞、可伤害和可交互对象须由独立游戏数据定义。</footer>
<script>
const DATA=/*__SCENE_DATA__*/null;
const $=id=>document.getElementById(id),find=id=>DATA.assets.find(a=>a.id===id);let bg='check',renderToken=0;
const names={far:'远景',mid:'透明中景',kit:'基础地形组件',arena:'首领场景',special:'专属机关与状态'};
for(const w of DATA.worlds)$('world').add(new Option(w.id+' '+w.name,w.id));
function selectWorld(){const levels=DATA.levels.filter(l=>l.world===$('world').value);$('level').replaceChildren(...levels.map(l=>new Option(l.id+' '+l.name,l.id)));render();}
function changeMid(){const l=DATA.levels.find(l=>l.id===$('level').value);$('middle').hidden=!l.mid||!$('showMid').checked;$('middle').style.opacity=Number($('opacity').value)/100;}
function background(){document.querySelectorAll('.source').forEach(e=>{e.className='source'+(bg==='check'?'':' '+bg)});document.querySelectorAll('[data-bg]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.bg===bg)));}
async function render(){const token=++renderToken,l=DATA.levels.find(l=>l.id===$('level').value);$('heading').textContent=l.id+' · '+l.name;$('focus').textContent='场景设计重点：'+l.focus;
 $('back').src=find(l.background).path;if(l.mid)$('middle').src=find(l.mid).path;else $('middle').removeAttribute('src');changeMid();
 const ids=[l.terrain,l.special,...l.sharedAssets,...l.extraAssets].filter((id,i,a)=>a.indexOf(id)===i);$('cards').replaceChildren();
 for(const id of ids){const a=find(id),article=document.createElement('article');article.className='card';const link=document.createElement('a');link.href=a.path;const img=document.createElement('img');img.className='source';img.src=a.path;img.alt=a.id+' '+names[a.kind];link.append(img);const h=document.createElement('h3');h.textContent=a.id+' · '+names[a.kind];const p=document.createElement('p');p.textContent=a.width+'×'+a.height+' · '+(a.transparent?'真实Alpha PNG':'背景 PNG');article.append(link,h,p);$('cards').append(article);}
 $('links').replaceChildren();for(const a of DATA.assets.filter(a=>a.world===l.world)){const p=document.createElement('p');p.append(a.id+' · ');for(const [title,url] of [['PNG',a.path],['提示词',a.prompt]]){const link=document.createElement('a');link.textContent=title;link.href=url;p.append(link,' ')}$('links').append(p);}background();
 $('loadStatus').textContent='加载当前关卡源图…';const imgs=[$('back'),...(l.mid?[$('middle')]:[]),...$('cards').querySelectorAll('img')];const result=await Promise.allSettled(imgs.map(i=>i.decode()));if(token!==renderToken)return;const failed=result.filter(r=>r.status==='rejected').length;$('loadStatus').textContent=failed?'有 '+failed+' 张图片加载失败，请检查文件路径。':'当前 '+imgs.length+' 张源图已加载。';
}
$('world').onchange=selectWorld;$('level').onchange=render;$('showMid').onchange=changeMid;$('opacity').oninput=changeMid;document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{bg=b.dataset.bg;background()});selectWorld();
</script></html>
